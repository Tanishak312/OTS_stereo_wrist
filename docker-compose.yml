# One container on one machine, e.g. an EC2 instance. On ECS the task definition
# replaces this file. Copy .env.docker.example to .env.docker first.
# network_mode: bridge uses Docker's existing bridge, so Compose does not
# allocate a new subnet. A new project network fails on hosts whose address
# pools are already fully subnetted.
services:
  ots-web:
    build: .
    image: ots-web
    env_file: .env.docker
    network_mode: bridge
    ports:
      - "2204:2204"
    restart: unless-stopped
